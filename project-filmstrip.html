<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8c9ad">
  <title>Sandeep Das — Project Filmstrip</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: #d8c9ad;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8c9ad;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(80, 58, 31, 0.08) 1px, transparent 1px) 50% 0 / 25% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 109px,
          rgba(72, 52, 30, 0.13) 110px,
          transparent 111px
        ),
        radial-gradient(circle at var(--pointer-x) 48%, rgba(255, 246, 220, 0.78), transparent 34%),
        #d8c9ad;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.27;
      background:
        repeating-radial-gradient(circle at 12% 18%, rgba(71, 51, 30, 0.17) 0 0.5px, transparent 0.7px 4px),
        repeating-radial-gradient(circle at 78% 71%, rgba(255, 255, 255, 0.35) 0 0.5px, transparent 0.8px 5px);
      mix-blend-mode: multiply;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(84, 58, 29, 0.19),
        transparent 14%,
        transparent 86%,
        rgba(84, 58, 29, 0.19)
      );
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(178px, min(19vw, 30vh), 270px);
      aspect-ratio: 0.72;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(47, 34, 19, 0.42);
      border-radius: 4px;
      color: #f3e7ce;
      background: #e7d9bd;
      box-shadow:
        0 calc(10px + var(--focus) * 24px) calc(18px + var(--focus) * 36px)
          rgba(57, 38, 19, calc(0.2 + var(--focus) * 0.26)),
        inset 0 0 0 1px rgba(255, 255, 255, 0.64);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(28, 22, 14, calc(0.12 + var(--focus) * 0.12));
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(57, 38, 19, 0.42),
        0 0 0 4px rgba(197, 79, 25, 0.34);
    }

    .portrait {
      position: absolute;
      inset: 7px 7px 25%;
      overflow: hidden;
      background: #766a58;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(calc(1.04 + (1 - var(--focus)) * 0.06));
      filter:
        sepia(calc((1 - var(--focus)) * 0.24))
        saturate(calc(0.66 + var(--focus) * 0.34))
        contrast(1.04);
    }

    .footer {
      position: absolute;
      right: 7px;
      bottom: 7px;
      left: 7px;
      height: calc(25% - 7px);
      display: grid;
      grid-template-columns: clamp(26px, 3.2vw, 43px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 11px);
      padding: clamp(7px, 0.8vw, 12px);
      color: #f0dfc2;
      background: #171612;
      text-align: left;
    }

    .index {
      display: grid;
      width: clamp(23px, 2.7vw, 37px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid #ce5d20;
      border-radius: 50%;
      color: #d86724;
      font: 600 clamp(7px, 0.68vw, 11px)/1 ui-monospace, "SFMono-Regular", monospace;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: #f3e6cc;
      font-size: clamp(8px, 0.86vw, 13px);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .role {
      margin-top: clamp(3px, 0.35vw, 5px);
      color: #d46a27;
      font-size: clamp(5px, 0.48vw, 7px);
      font-weight: 700;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 560px;
        cursor: ns-resize;
        background:
          linear-gradient(90deg, rgba(80, 58, 31, 0.08) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(72, 52, 30, 0.13) 88px,
            transparent 89px
          ),
          radial-gradient(circle at 50% 50%, rgba(255, 246, 220, 0.78), transparent 35%),
          #d8c9ad;
      }

      .card {
        width: clamp(160px, min(54vw, 31vh), 220px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  
    .card { color: inherit; text-decoration: none; }
    .project-art { display:block; width:100%; height:100%; background-size:400% 400%; background-repeat:no-repeat; transform:scale(calc(1.04 + (1 - var(--focus)) * .06)); filter:sepia(calc((1 - var(--focus)) * .18)) saturate(calc(.76 + var(--focus) * .34)) contrast(1.04); }
    .name { font-size:clamp(8px,.76vw,12px); line-height:1.15; }
    .role { font-size:clamp(6px,.56vw,9px); }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive filmstrip of Sandeep Das GitHub projects">
    
    <div class="deck" id="deck" data-testid="filmstrip"></div>
  </main>

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = profile.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Open ${profile.name} on GitHub`);
        card.innerHTML = `
          <span class="portrait">
            <span class="project-art" role="img" aria-label="Artwork for ${profile.name}" style="background-image:url(${sprite});background-position:${profile.col * 33.3333}% ${profile.row * 33.3333}%"></span>
          </span>
          <span class="footer">
            <span class="index">${String(index + 1).padStart(2, "0")}</span>
            <span class="meta">
              <span class="name">${profile.name}</span>
              <span class="role">${profile.role}</span>
            </span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 3,
        target: 3,
        base: 3,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base += delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", (event) => {
          if (nearestIndex() !== index) { event.preventDefault(); moveTo(index); }
        });
        card.addEventListener("focus", () => moveTo(index));
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        state.active = true;
        state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
        state.lastInput = performance.now();
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const rawDelta = Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
        if (!rawDelta) return;
        const amount = Math.sign(rawDelta) * Math.min(0.72, Math.max(0.14, Math.abs(rawDelta) / 180));
        state.base += amount;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.025, deltaTime / 1000);

        if (!reducedMotion && !state.active && time - state.lastInput > 4200) {
          const idle = time - state.lastInput - 3600;
          state.target = state.base + Math.sin(idle * 0.00032) * 1.65;
        }

        state.phase += (state.target - state.phase) * ease;
        const compact = innerWidth < 650 || innerHeight > innerWidth * 1.2;
        const activeIndex = nearestIndex();
        const horizontalSpacing = Math.min(190, Math.max(104, innerWidth * 0.12));
        const verticalSpacing = Math.min(138, Math.max(82, innerHeight * 0.115));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
