<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio responsive review</title><style>body{margin:0;background:#222;color:#ddd;font:13px system-ui}nav{position:sticky;top:0;display:flex;gap:12px;padding:14px;background:#222;z-index:1}button{font:inherit;padding:10px;cursor:pointer}#wrap{margin:16px auto;width:390px}iframe{display:block;background:#111;border:1px solid #999;width:390px;height:844px}</style></head><body><nav><button data-size="390,844">Phone 390</button><button data-size="320,740">Small phone 320</button><button data-size="768,1024">Tablet 768</button><button data-size="844,390">Landscape 844</button><button data-size="1440,900">Desktop 1440</button></nav><div id="wrap"><iframe title="Portfolio responsive preview" src="frontier-preview.html"></iframe></div><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';document.querySelector('#wrap').style.width=w+'px';}));</script></body></html>
