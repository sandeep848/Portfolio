<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Portfolio responsive review</title><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#242426;color:#fff;font:12px system-ui}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{color:#fff;background:#39393c;border:1px solid #666;padding:8px 12px;cursor:pointer;text-decoration:none}#wrap{margin:0 auto;position:relative}iframe{border:0;display:block;transform-origin:top left;background:#0c0d0c}#state{margin-left:auto}</style></head><body><header><button data-w="1440" data-h="1000">Desktop 1440</button><button data-w="820" data-h="1080">Tablet 820</button><button data-w="390" data-h="844">Phone 390</button><button data-w="320" data-h="820">Small phone 320</button><button id="fallback">CSS fallback</button><a href="./" target="_blank">Open portfolio</a><span id="state"></span></header><div id="wrap"><iframe src="./" title="Portfolio preview"></iframe></div><script>const f=document.querySelector('iframe'),wrap=document.querySelector('#wrap');let width=1440,height=1000;function size(){const scale=Math.min(1,(innerWidth-24)/width);f.style.width=width+'px';f.style.height=height+'px';f.style.transform='scale('+scale+')';wrap.style.width=(width*scale)+'px';wrap.style.height=(height*scale)+'px';document.querySelector('#state').textContent=width+' × '+height}document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{width=+b.dataset.w;height=+b.dataset.h;size()});document.querySelector('#fallback').onclick=()=>{f.src='./?fallback=1'};addEventListener('resize',size);size();</script></body></html>
